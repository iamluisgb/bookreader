<!doctype html><html><head><meta charset="utf-8"><style>
/* Plantilla de assets/og-libro-compartido.png. Se regenera con Playwright: captura de 1200×630. */
html,body{margin:0;width:1200px;height:630px;font-family:-apple-system,"Inter","Segoe UI",system-ui,sans-serif;background:#faf8f3;color:#1d1d1f}
.wrap{position:relative;width:1200px;height:630px;box-sizing:border-box;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.brand{display:flex;align-items:center;gap:16px;font-weight:700;font-size:30px;letter-spacing:-.01em}
.brand svg{width:52px;height:52px}
h1{font-size:62px;line-height:1.05;letter-spacing:-.03em;margin:0;max-width:560px}
p{font-size:27px;line-height:1.35;color:#5f5f64;margin:20px 0 0;max-width:600px}
.shelf{position:absolute;right:70px;transform:scale(.82);transform-origin:right bottom;bottom:120px;display:flex;align-items:flex-end;gap:14px}
.b{border-radius:6px;box-shadow:0 10px 24px rgba(0,0,0,.14);display:flex;align-items:flex-end;justify-content:center;padding-bottom:16px;box-sizing:border-box;color:rgba(255,255,255,.9);font-weight:700;font-size:15px;writing-mode:vertical-rl;transform:rotate(180deg)}
.line{position:absolute;right:52px;bottom:112px;width:370px;height:8px;border-radius:4px;background:#e3ded3}
.foot{font-size:22px;color:#7a736a}
.book{position:absolute;right:150px;bottom:110px;width:250px;height:350px;transform:rotate(-4deg);display:flex;filter:drop-shadow(0 18px 28px rgba(0,0,0,.18))}
.spine{width:22px;background:#245a3f;border-radius:6px 0 0 6px}
.cover{flex:1;background:#2f6f4f;border-radius:0 8px 8px 0;position:relative;padding:44px 30px;box-sizing:border-box}
.cover div{background:rgba(255,255,255,.85);border-radius:4px;height:14px;margin-bottom:14px}
.cover .l1{width:80%;height:20px}.cover .l2{width:60%;height:20px;margin-bottom:40px}.cover .l3{width:45%;opacity:.6}
.cover .mark{position:absolute;right:26px;top:0;width:26px;height:70px;background:#22c55e;border-radius:0;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
</style></head><body><div class="wrap">
<div class="brand"><svg viewBox="0 0 512 512"><rect width="512" height="512" rx="118" fill="#111418"/><path d="M288 119 Q288 99 308 99 L396 99 Q416 99 416 119 L416 371 L352 323 L288 371 Z" fill="#22c55e"/><path d="M98 90 L222 90 Q256 90 256 124 L256 470 C 249 442 233 424 206 414 C 177 403 140 401 100 401 Q64 401 64 365 L64 124 Q64 90 98 90 Z" fill="#f8fafc"/></svg>BookReader</div>
<div><h1>Te han compartido un libro</h1><p>Ábrelo y tendrás el libro con las notas, libretas y mapas de quien te lo manda.</p></div>
<div class="foot">bookreader.raiatech.com</div>
<div class="book"><div class="spine"></div><div class="cover"><div class="l1"></div><div class="l2"></div><div class="l3"></div><div class="mark"></div></div></div>
</div></body></html>
